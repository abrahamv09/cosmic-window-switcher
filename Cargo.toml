[package]
name = "cosmic-window-switcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"
description = "A native Window switcher for the COSMIC desktop"
repository = "https://github.com/abrahamv09/cosmic-window-switcher"

[lib]
name = "cosmic_window_switcher"
path = "src/lib.rs"

[[bin]]
name = "cosmic-window-switcher"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"

[dependencies]
accesskit = "0.24.1"
accesskit_unix = "0.22.1"
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
cosmic-client-toolkit = "0.2.0"
cosmic-protocols = { version = "0.2.0", default-features = false, features = ["client"] }
cosmic-text = "0.19.0"
freedesktop-icons = "0.4.0"
image = { version = "0.25.8", default-features = false, features = ["png"] }
resvg = { version = "0.45.1", default-features = false }
rustix = { version = "1.1.4", features = ["event"] }
serde = { version = "1.0.229", features = ["derive"] }
smithay-client-toolkit = "0.20.0"
wayland-client = "0.31.11"
wayland-protocols = { version = "0.32.9", features = ["client", "staging"] }
zbus = "5.18.0"
